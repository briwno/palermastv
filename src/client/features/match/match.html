<section id="page-partida" class="page" hidden>
  <div class="match-top">
    <button class="text-button" data-go="jogos">← Jogos do dia</button
    ><span class="eyebrow" id="match-league">CENTRAL DA PARTIDA</span
    ><button class="button subtle" id="match-refresh">Atualizar ↻</button>
  </div>
  <div id="match-scoreboard" class="match-scoreboard" aria-live="polite">
    <div class="empty-message">Selecione uma partida na agenda.</div>
  </div>
  <div class="match-toolbar">
    <span id="match-source" class="data-note"></span
    ><button class="button lime" id="match-watch">Assistir na sala ↗</button>
  </div>
  <div class="match-tabs" role="tablist" aria-label="A partida">
    <button
      id="tab-overview"
      role="tab"
      data-match-tab="overview"
      aria-selected="true"
      aria-controls="match-overview"
    >
      <svg
        class="ui-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </svg>
      Visão geral</button
    ><button
      id="tab-lineups"
      role="tab"
      data-match-tab="lineups"
      aria-selected="false"
      aria-controls="match-lineups"
      tabindex="-1"
    >
      <svg
        class="ui-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M3 12h18M8 3v4h8V3M8 21v-4h8v4" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      Escalações</button
    ><button
      id="tab-statistics"
      role="tab"
      data-match-tab="statistics"
      aria-selected="false"
      aria-controls="match-statistics"
      tabindex="-1"
    >
      <svg
        class="ui-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 20V10h4v10m2 0V4h4v16m2 0v-7h4v7M2 20h20" />
      </svg>
      Estatísticas</button
    ><button
      id="tab-events"
      role="tab"
      data-match-tab="events"
      aria-selected="false"
      aria-controls="match-events"
      tabindex="-1"
    >
      <svg
        class="ui-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M3 12h4l3-8 4 16 3-8h4" />
      </svg>
      Lances</button
    ><button
      id="tab-picks"
      role="tab"
      data-match-tab="picks"
      aria-selected="false"
      aria-controls="match-picks"
      tabindex="-1"
    >
      <svg
        class="ui-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
        <circle cx="12" cy="12" r="1" />
      </svg>
      Palpites
    </button>
  </div>
  <details class="match-community-menu">
    <summary>Mais da partida <span>Notas · votação · resenha</span></summary>
    <div class="match-secondary-tabs" role="tablist" aria-label="A galera">
      <button
        id="tab-ratings"
        role="tab"
        data-match-tab="ratings"
        aria-selected="false"
        aria-controls="match-ratings"
        tabindex="-1"
      >
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"
          />
        </svg>
        Notas dos jogadores</button
      ><button
        id="tab-awards"
        role="tab"
        data-match-tab="awards"
        aria-selected="false"
        aria-controls="match-awards"
        tabindex="-1"
      >
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" />
          <path d="M12 7v10M8 12h8" />
        </svg>
        Craque e bagre</button
      ><button
        id="tab-polls"
        role="tab"
        data-match-tab="polls"
        aria-selected="false"
        aria-controls="match-polls"
        tabindex="-1"
      >
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 20V10h4v10m2 0V4h4v16m2 0v-7h4v7M2 20h20" />
        </svg>
        Enquetes</button
      ><button
        id="tab-social"
        role="tab"
        data-match-tab="social"
        aria-selected="false"
        aria-controls="match-social"
        tabindex="-1"
      >
        <svg
          class="ui-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M21 11a8 8 0 0 1-8 8H7l-4 3V7a4 4 0 0 1 4-4h6a8 8 0 0 1 8 8Z"
          />
          <path d="M7 9h10M7 13h6" />
        </svg>
        Resenha / X
      </button>
    </div>
  </details>
  <div
    id="match-overview"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-overview"
  ></div>
  <div
    id="match-lineups"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-lineups"
    hidden
  ></div>
  <div
    id="match-statistics"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-statistics"
    hidden
  ></div>
  <div
    id="match-events"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-events"
    hidden
  ></div>
  <div
    id="match-picks"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-picks"
    hidden
  >
    <div id="match-picks-content"></div>
  </div>
  <div
    id="match-polls"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-polls"
    hidden
    data-lounge
  ></div>
  <div
    id="match-social"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-social"
    hidden
  ></div>
  <div
    id="match-ratings"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-ratings"
    hidden
  ></div>
  <div
    id="match-awards"
    class="match-tab-panel"
    role="tabpanel"
    aria-labelledby="tab-awards"
    hidden
  ></div>
</section>
